    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage" />
    <dc:title>把任务深度与计算预算分开</dc:title>
    <dc:date>2026-09-19T22:38:47.811155</dc:date>
    <dc:description>Original conceptual drawing; no newly measured experimental results. Left: completely empty grid, horizontal axis task dependency depth, vertical axis recurrent budget; shade a small lower region as training range without numeric ticks or measured cells, outline the rest as held-out combinations. Include a note that input length is controlled separately. Right: a decision tree with question core trajectories contain repairable errors? If no, return to core learning; if yes, compare stopping policy with offline oracle; if oracle improves but deployable policy fails, examine observability/calibration. All paths are proposed experimental decisions, not findings.</dc:description>
