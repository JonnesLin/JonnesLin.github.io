 <ns0:title>Four experiments that can fail</ns0:title>
 <ns0:metadata>
  <rdf:RDF>
   <ns2:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage" />
    <dc:title>Four experiments that can fail</dc:title>
    <dc:date>2026-09-19T22:38:47.756036</dc:date>
    <dc:description>Original conceptual drawing; no newly measured experimental results. A two-by-two arrangement of equal cards. Each card has a short question and a simple intervention icon: state transplant, blank dependency-depth versus loop-budget grid, continue/stop branch, and image versus fixed embedding. Add a conspicuous proposed-experiments/no-results label. No scores, success checks, rising curves, or ranking among approaches.</dc:description>
