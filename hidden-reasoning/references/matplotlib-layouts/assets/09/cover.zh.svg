    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage" />
    <dc:title>三种保证，三份证据</dc:title>
    <dc:date>2026-09-19T22:38:47.103376</dc:date>
    <dc:description>Original conceptual drawing; no newly measured experimental results. Three equal, visually separate gate-like cards, no staircase and no arrow implying automatic progress. Left: model class containing a marked solution; middle: optimization trajectory ending at a question mark; right: train-length strip and longer test strip with a question mark. A shared lower band lists attention, precision, and steps. This is a conceptual distinction, never a measured result.</dc:description>
