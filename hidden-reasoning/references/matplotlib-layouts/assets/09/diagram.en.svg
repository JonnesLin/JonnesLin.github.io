<ns0:svg xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:ns0="http://www.w3.org/2000/svg" xmlns:ns2="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" width="1200" height="900" viewBox="0 0 864 648" version="1.1">
 <ns0:title>Read the result with its conditions</ns0:title>
 <ns0:metadata>
  <rdf:RDF>
   <ns2:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage" />
    <dc:title>Read the result with its conditions</dc:title>
    <dc:date>2026-09-19T22:49:13.827251</dc:date>
    <dc:description>Original conceptual drawing; no newly measured experimental results. Four horizontal rows, each with a claim card and a conditions card. CoT expressivity: linear intermediate steps can recognize regular languages; log precision and saturated attention. UHAT lower bound: parity needs Ω(n) CoT, bounded layer/head counts, unique hard choice. Looped approximation: fixed-length continuous permutation-equivariant functions in Lp, loops r&gt;n, infinite precision in universality corollary. Log-ICoT: log2(k) stages, structured parity curriculum and restricted training, zero-filled positions remain. Do not place these rows on a shared performance axis. The rows summarize model-dependent theorems and do not imply ordinary softmax BF16 training inherits them.</dc:description>
    <dc:format>image/svg+xml</dc:format>
    <dc:creator>
     <ns2:Agent>
      <dc:title>Matplotlib v3.8.0, https://matplotlib.org/</dc:title>
     </ns2:Agent>
    </dc:creator>
   </ns2:Work>
  </rdf:RDF>
 </ns0:metadata>
