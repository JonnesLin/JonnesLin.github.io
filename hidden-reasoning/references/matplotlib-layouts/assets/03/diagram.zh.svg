 <ns0:title>CODI：对齐答案前的状态</ns0:title>
 <ns0:metadata>
  <rdf:RDF>
   <ns2:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage" />
    <dc:title>CODI：对齐答案前的状态</dc:title>
    <dc:date>2026-09-19T22:38:45.982974</dc:date>
    <dc:description>Original conceptual drawing; no newly measured experimental results. Two parallel paths labelled teacher task and student task, tied by a shared-weights bracket. Teacher inputs question plus explicit CoT and reaches a marked pre-answer colon position, then answer; teacher CE supervises both trajectory and answer. Student sees question plus self-generated continuous states, reaches its own pre-answer colon position, then answer with student CE. Dashed KD edge runs from teacher multilayer activations to student activations; place stop-gradient only on the teacher target of that edge. The teacher branch remains updated by teacher CE; do not mark it frozen. Label alignment as normalized L1. Small caption notes simplified continuous generation and layer injection details.</dc:description>
    <dc:format>image/svg+xml</dc:format>
