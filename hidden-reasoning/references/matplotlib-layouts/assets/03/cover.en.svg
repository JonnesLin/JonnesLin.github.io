<ns0:svg xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:ns0="http://www.w3.org/2000/svg" xmlns:ns2="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" width="1200" height="675" viewBox="0 0 864 486" version="1.1">
 <ns0:title>Learning steps without writing them</ns0:title>
 <ns0:metadata>
  <rdf:RDF>
   <ns2:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage" />
    <dc:title>Learning steps without writing them</dc:title>
    <dc:date>2026-09-19T22:38:45.927115</dc:date>
    <dc:description>Original conceptual drawing; no newly measured experimental results. Three clear panels. State targets: teacher representation above student-predicted representation with supervision arrow. Curriculum: successive rows remove more prefix tokens, keeping suffix and answer targets. Terminal alignment: explicit and continuous paths meet at paired pre-answer states with a dashed alignment edge. Use no accuracy numbers, no claim that each deleted word is stored in a specific neuron. Panels depict training signals, not three free runtime options.</dc:description>
