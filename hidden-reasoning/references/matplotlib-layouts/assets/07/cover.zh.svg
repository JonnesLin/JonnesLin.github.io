    <dc:title>下一个向量，写到哪里？</dc:title>
    <dc:date>2026-09-19T22:38:46.714565</dc:date>
    <dc:description>Original conceptual drawing; no newly measured experimental results. Two rows. Coconut row grows a sequence to the right by adding a new latent position, retaining visible earlier position boxes and a history bracket. Huginn row repeats the same fixed set of position boxes across successive depth snapshots; dashed vertical correspondence lines show that addresses do not grow. The diagram must not imply equal capacity, equal single-step cost, or equal cache consumption. Show no numerical outcome.</dc:description>
