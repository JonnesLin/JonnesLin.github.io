<ns0:svg xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:ns0="http://www.w3.org/2000/svg" xmlns:ns2="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" width="1200" height="900" viewBox="0 0 864 648" version="1.1">
 <ns0:title>Three continuous feedback interfaces</ns0:title>
 <ns0:metadata>
  <rdf:RDF>
   <ns2:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage" />
    <dc:title>Three continuous feedback interfaces</dc:title>
    <dc:date>2026-09-19T22:38:46.880585</dc:date>
    <dc:description>Original conceptual drawing; no newly measured experimental results. Three horizontal paths with distinct labels. Coconut: final hidden state -&gt; next-position input embedding, with earlier KV history visible underneath. PonderLM: word probabilities -&gt; weighted vocabulary embedding -&gt; add to accumulated input -&gt; next pass; label residual additions accumulate so this cannot be read as E0 plus only the newest vector. Huginn: fixed input condition plus current state -&gt; shared core -&gt; updated state, with readout after chosen round. Do not draw a vocabulary distribution as separately evaluated search branches. Keep any equation short and portable, e.g. E(s)=E(0)+sum v(r).</dc:description>
    <dc:format>image/svg+xml</dc:format>
    <dc:creator>
     <ns2:Agent>
      <dc:title>Matplotlib v3.8.0, https://matplotlib.org/</dc:title>
     </ns2:Agent>
    </dc:creator>
   </ns2:Work>
  </rdf:RDF>
 </ns0:metadata>
