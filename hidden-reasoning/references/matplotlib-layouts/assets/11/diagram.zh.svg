 <ns0:title>换状态，保留后缀，检验反事实</ns0:title>
 <ns0:metadata>
  <rdf:RDF>
   <ns2:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage" />
    <dc:title>换状态，保留后缀，检验反事实</dc:title>
    <dc:date>2026-09-19T22:38:47.608165</dc:date>
    <dc:description>Original conceptual drawing; no newly measured experimental results. Two natural-input trajectories form donor and recipient rows. Mark states s_d and s_r at the same computation stage. Only s_d is transplanted into the recipient at that stage; recipient suffix operations remain unchanged. The resulting answer box contains a question mark and is compared to a separately calculated counterfactual answer, never a success check. A secondary muted control row names unrelated-state, matched random, and input-cache-only swaps. No numerical recovery rates.</dc:description>
    <dc:format>image/svg+xml</dc:format>
