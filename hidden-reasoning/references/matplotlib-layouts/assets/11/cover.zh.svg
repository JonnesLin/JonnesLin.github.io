    <dc:date>2026-09-19T22:38:47.497556</dc:date>
    <dc:description>Original conceptual drawing; no newly measured experimental results. Input flows into a hidden-state circle; one upper branch goes to a probe and decoded intermediate value; the main horizontal branch goes to the model readout and answer. A dashed bypass connects input directly to model readout. A swap marker at the hidden state is a proposed intervention, not evidence of successful recovery. Use different probe/model colors and label both.</dc:description>
