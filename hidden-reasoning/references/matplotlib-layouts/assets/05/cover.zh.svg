 <ns0:title>同一份输入，可以再更新一轮</ns0:title>
 <ns0:metadata>
  <rdf:RDF>
   <ns2:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage" />
    <dc:title>同一份输入，可以再更新一轮</dc:title>
    <dc:date>2026-09-19T22:45:57.471856</dc:date>
    <dc:description>Original conceptual drawing; no newly measured experimental results. Two horizontal lanes. Top lane progresses from one input position to the next; every update receives a different input token. Bottom lane keeps one fixed input condition visible and runs the same blue update block again. Identical blue means shared update parameters. Do not draw a speed comparison, success percentages, or a claim that a longer chain is better. Include a small conceptual-diagram label.</dc:description>
