    <dc:title>每一轮都能重新读取问题</dc:title>
    <dc:date>2026-09-19T22:38:46.414148</dc:date>
    <dc:description>Original conceptual drawing; no newly measured experimental results. A fixed problem-condition box spans the top and feeds each of several identical shared update boxes through separate downward arrows. A candidate-state path runs left to right through those updates, with state boxes between them. Use ellipses to make the unroll generic, with no actual iteration counts. Same block color denotes shared weights. Mark this as an architecture/algorithm analogy, not evidence that the Transformer executes gradient descent or converges.</dc:description>
