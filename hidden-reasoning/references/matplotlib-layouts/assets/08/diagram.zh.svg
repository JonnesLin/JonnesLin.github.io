 <ns0:title>有正确状态，还要能选中它</ns0:title>
 <ns0:metadata>
  <rdf:RDF>
   <ns2:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage" />
    <dc:title>有正确状态，还要能选中它</dc:title>
    <dc:date>2026-09-19T22:38:47.009001</dc:date>
    <dc:description>Original conceptual drawing; no newly measured experimental results. Reuse the four-state wrong/right/right/wrong illustrative trajectory. Under it, show three separate decision rows: fixed final depth points to the final wrong state; actual policy has no access to correctness labels and its choice is marked unresolved rather than assumed correct; oracle has explicit label access and can identify either earlier correct state. Make correctness labels visibly part of the analyst view, never an input arrow to the actual policy. Label oracle as diagnostic upper bound only. Do not use measured scores or guarantee a learned gate can select a correct state.</dc:description>
