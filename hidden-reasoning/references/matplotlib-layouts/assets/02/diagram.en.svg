 <ns0:title>Hidden from view, different in computation</ns0:title>
 <ns0:metadata>
  <rdf:RDF>
   <ns2:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage" />
    <dc:title>Hidden from view, different in computation</dc:title>
    <dc:date>2026-09-19T22:45:56.257770</dc:date>
    <dc:description>Original conceptual drawing; no newly measured experimental results. Three horizontal computation rows. Pause: input plus predetermined pause embeddings processed by a single stack, then answer. Quiet-STaR: an observed prefix branches into a short discrete rationale token chain and then helps future-text prediction; label rationale as hidden discrete text. Continuous feedback: previous hidden state becomes next-position input, requiring sequential passes; place a separate historical-KV-cache box accessible by each pass. Keep the cache concept separate from the current feedback vector. Mark this a schematic, not a timing comparison. No exchange of rationale content between separate branches.</dc:description>
    <dc:format>image/svg+xml</dc:format>
    <dc:creator>
     <ns2:Agent>
      <dc:title>Matplotlib v3.8.0, https://matplotlib.org/</dc:title>
     </ns2:Agent>
    </dc:creator>
   </ns2:Work>
  </rdf:RDF>
 </ns0:metadata>
