    <dc:title>Extra positions or extra rounds?</dc:title>
    <dc:date>2026-09-19T22:38:45.723275</dc:date>
    <dc:description>Original conceptual drawing; no newly measured experimental results. Two large panels. Left: several input tiles, including pause tiles, already present below one model stack. Right: model stack -&gt; new token -&gt; another model stack -&gt; new token. All model stacks represent full forward passes. Use width on left and serial dependency on right; no clocks, speedup factors or numeric accuracy. Note that positions versus passes are distinct resources.</dc:description>
