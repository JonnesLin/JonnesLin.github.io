 <ns0:title>Forward depth and backward depth differ</ns0:title>
 <ns0:metadata>
  <rdf:RDF>
   <ns2:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage" />
    <dc:title>Forward depth and backward depth differ</dc:title>
    <dc:date>2026-09-19T22:40:10.178863</dc:date>
    <dc:description>Original conceptual drawing; no newly measured experimental results. A shared-core forward chain runs left to right in two visibly labeled groups: earlier executed rounds and final gradient window. Use ellipses so the count is not literal. All rounds receive a solid forward arrow. Draw a separate backward arrow only through the final group, stopping at an explicit detach boundary. A fixed input-condition line feeds updates on both sides; optionally show that its late injections can receive gradient without reconnecting the detached state history. Caption annotation: schematic unroll; Huginn main-run window at most eight final rounds. Do not imply earlier computation is skipped or free.</dc:description>
    <dc:format>image/svg+xml</dc:format>
    <dc:creator>
