    <dc:date>2026-09-19T22:40:10.015931</dc:date>
    <dc:description>Original conceptual drawing; no newly measured experimental results. Create a clean five-part conceptual overview with five equally legible cards: starting state, forward rounds, backward window, readout, and cache. Organize state-to-forward-to-readout as the main flow; show backward window and cache as explicitly separate controls, not extra forward layers. No measured throughput or score. No made-up probability distributions.</dc:description>
