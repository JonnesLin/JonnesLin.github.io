<ns0:svg xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:ns0="http://www.w3.org/2000/svg" xmlns:ns2="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" width="1200" height="900" viewBox="0 0 864 648" version="1.1">
 <ns0:title>Find the state and repeated operation</ns0:title>
 <ns0:metadata>
  <rdf:RDF>
   <ns2:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage" />
    <dc:title>Find the state and repeated operation</dc:title>
    <dc:date>2026-09-19T22:40:09.970237</dc:date>
    <dc:description>Original conceptual drawing; no newly measured experimental results. Three labelled rows. Explicit CoT: question to model to vocabulary choice to embedding, with a dependency into the next full-model pass, then answer. Continuous chain: question to model to hidden vector, directly into the next position's model pass, then language readout. Recurrent depth: encode question into e; input e fans into each repeated invocation of one core F; state s passes from one invocation to the next at the same sequence positions; final readout C produces answer. Mark F weights shared. A thin note says historical caches omitted and arrows are data dependencies. Avoid depicting a generated token loop as an internal-depth loop.</dc:description>
    <dc:format>image/svg+xml</dc:format>
    <dc:creator>
     <ns2:Agent>
      <dc:title>Matplotlib v3.8.0, https://matplotlib.org/</dc:title>
     </ns2:Agent>
    </dc:creator>
   </ns2:Work>
  </rdf:RDF>
 </ns0:metadata>
