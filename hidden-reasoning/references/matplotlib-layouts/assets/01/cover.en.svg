 <ns0:title>Same answer, different computation</ns0:title>
 <ns0:metadata>
  <rdf:RDF>
   <ns2:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage" />
    <dc:title>Same answer, different computation</dc:title>
    <dc:date>2026-09-19T22:40:09.813887</dc:date>
    <dc:description>Original conceptual drawing; no newly measured experimental results. Three separate horizontal paths start from an input and end in the same small answer tile. Top path contains a word token followed by a feedback arrow; middle contains a vector tile followed by feedback; bottom contains the same shared-core tile visited repeatedly. No numerical runtime comparison, no ranking. Make the three interfaces visibly different. The number of drawn steps is illustrative; do not suggest equal cost.</dc:description>
