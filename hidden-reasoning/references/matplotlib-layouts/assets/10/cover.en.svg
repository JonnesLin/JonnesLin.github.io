 <ns0:title>One set of weights, repeated computation</ns0:title>
 <ns0:metadata>
  <rdf:RDF>
   <ns2:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage" />
    <dc:title>One set of weights, repeated computation</dc:title>
    <dc:date>2026-09-19T22:38:47.344249</dc:date>
    <dc:description>Original conceptual drawing; no newly measured experimental results. One weight-storage rectangle fans into three illustrative sequential core-call rectangles, followed by a small answer box. Label the three repeated boxes as an example only, not a model-specific count. Beneath, place independent storage, work, and elapsed-time cards with icons but no numeric bars. No declining cost curve or claimed speedup.</dc:description>
