    <dc:title>先画请求，再选择预算</dc:title>
    <dc:date>2026-09-19T22:38:47.393328</dc:date>
    <dc:description>Original conceptual drawing; no newly measured experimental results. A horizontal pipeline shows preprocessing, latent/recurrent updates with a variable loop, output generation, and candidate selection. Distinguish selection as optional but billable. Below, four separate comparison cards read fixed parameters, fixed training FLOPs, fixed inference FLOPs, and fixed hardware latency. Do not use a common equals sign claiming all constraints match at once. Add a small note that an output call containing the core must not be counted twice.</dc:description>
