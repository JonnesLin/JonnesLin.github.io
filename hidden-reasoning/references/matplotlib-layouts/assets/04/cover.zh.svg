    <dc:description>Original conceptual drawing; no newly measured experimental results. Three panels, each with distinct topology: a vector feeding the next model pass; a question producing a short predicted state sequence; several soft-prompt tiles each leading to a written chain. Label feedback, compression, and prompt diversity. There is no universal ranking, no free branch expansion, and no promise of losslessness. Avoid drawing all three as the same unlabelled loop.</dc:description>
