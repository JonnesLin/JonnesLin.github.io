   </ns0:g>
   <ns0:g id="text_9">
    <ns0:text style="fill: #117d80; font: 24.48px 'Arial Unicode MS'; text-anchor: start" x="43.2" y="329.219325" transform="rotate(-0 43.2 329.219325)">直接反馈：h_t 成为下一位置的输入</ns0:text>
   </ns0:g>
   <ns0:g id="text_10">
    <ns0:text style="fill: #132a36; font: 26.64px 'Arial Unicode MS'; text-anchor: middle" x="100.8" y="402.520612" transform="rotate(-0 100.8 402.520612)">h_t</ns0:text>
