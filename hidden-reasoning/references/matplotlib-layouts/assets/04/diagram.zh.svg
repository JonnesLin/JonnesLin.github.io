 <ns0:title>连续反馈跳过了哪个接口？</ns0:title>
 <ns0:metadata>
  <rdf:RDF>
   <ns2:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage" />
    <dc:title>连续反馈跳过了哪个接口？</dc:title>
    <dc:date>2026-09-19T22:45:56.849086</dc:date>
    <dc:description>Original conceptual drawing; no newly measured experimental results. Two detailed rows. Ordinary autoregressive generation: current hidden state h_t -&gt; output head W -&gt; token choice u -&gt; token embedding E(u) -&gt; next full model forward -&gt; next hidden state. Direct continuous feedback: h_t routes directly as the next position's input e_(t+1), then next full model forward. Both rows lead eventually to a language readout and final answer. Show historical KV cache as a separate shared-access concept, not eliminated by direct feedback. A small optional alternative on the continuous edge says projection possible (CODI); avoid suggesting it is part of basic Coconut. No internal-search tree and no timing claims.</dc:description>
    <dc:format>image/svg+xml</dc:format>
    <dc:creator>
     <ns2:Agent>
      <dc:title>Matplotlib v3.8.0, https://matplotlib.org/</dc:title>
     </ns2:Agent>
    </dc:creator>
   </ns2:Work>
  </rdf:RDF>
 </ns0:metadata>
