   <ns0:g id="text_12">
    <ns0:text style="fill: #132a36; font: 26.64px 'Arial Unicode MS'; text-anchor: middle" x="709.2" y="402.657975" transform="rotate(-0 709.2 402.657975)">下次前向</ns0:text>
